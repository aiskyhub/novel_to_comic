  default_prompt: "使用 $novel-to-comic 忠实改编我提供的小说：按原文章节顺序，逐章完成细节清单、逐场详细剧本、逐格分镜和遗漏核查，保留关键剧情过程；约两千字常规章节先估60格、参考50–80格，成品页1080×2400、普通每页3–5格默认3格整宽纵排，正文360宽预览至少16 CSS像素，先打磨完整页提示词，一页一次生成包含所有画格与气泡的PNG，不分格生图或重组图片，本卷汇总审查锁定后整页一次生成并整页验收交付。"
